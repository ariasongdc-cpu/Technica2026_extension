name: Build Extension with Secret

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Injects the GEMINI_API_KEY GitHub Secret into config.js
      - name: Inject Secret
        run: |
          echo "const CONFIG = { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' };" > config.js

      # 2. Upload with recursive folder matching (/**)
      - name: Upload Ready Extension
        uses: actions/upload-artifact@v4
        with:
          name: TerpWhisper
          run: zip -r terpwhisper.zip . -x "*.git*" ".github/*" "check.json" "*.py" "*.txt"
          path: |
            manifest.json
            popup.html
            popup.js
            config.js
            fonts/**
            icons/**