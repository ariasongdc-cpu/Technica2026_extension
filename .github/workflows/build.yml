name: Build Extension with Secret

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Injects the GEMINI_API_KEY GitHub Secret into config.js
      - name: Inject Secret
        run: |
          echo "const CONFIG = { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' };" > config.js

      # Packages the extension as a ready-to-load ZIP artifact
      - name: Upload Ready Extension
        uses: actions/upload-artifact@v4
        with:
          name: TerpWhisper-Extension
          path: |
            manifest.json
            popup.html
            popup.js
            config.js
            fonts/
            icons/