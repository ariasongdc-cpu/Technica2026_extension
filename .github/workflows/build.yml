name: Build and Package Extension

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Gemini API Key into config.js
        run: |
          echo "const CONFIG = { GEMINI_API_KEY: \"${{ secrets.GEMINI_API_KEY }}\" };" > config.js

      - name: Verify font folder exists on runner
        run: ls -la font/

      - name: Create Extension Zip
        run: |
          zip -r terpwhisper-extension.zip manifest.json popup.html popup.js config.js icons/ font/

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terpwhisper-extension
          path: terpwhisper-extension.zip