<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terp Insight</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 340px;
      padding: 16px;
      background: #fff8fc;
      color: #302333;
    }

    h1 {
      color: #c13f83;
      font-size: 22px;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 8px;
    }

    input {
      border: 1px solid #e2b5d0;
    }

    button {
      background: #c13f83;
      color: white;
      border: none;
      cursor: pointer;
    }

    #result {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1> ⭐ Terp Insight</h1>
  <p>Understand the professor at a glance.</p>

  <input id="professorName" placeholder="Enter professor's name">
  <button id="analyze">Analyze reviews</button>

  <p id="status"></p>
  <pre id="result"></pre>

  <script src="popup.js"></script>
</body>
</html>
